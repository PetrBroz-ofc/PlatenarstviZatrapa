<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administrace — Platnéřství Pavel Zátrapa</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">

<div class="admin-login" id="adminLogin">
  <div class="admin-login-card">
    <div class="admin-login-brand"><img src="/assets/img/brand/logo-pz-mark.png" alt="" width="22" height="22">Platnéřství Zátrapa</div>
    <h1>Přihlášení</h1>
    <p class="sub">Zadej heslo pro přístup do administrace.</p>
    <div class="err" id="loginErr"></div>
    <input type="password" id="loginPassword" placeholder="Heslo" autocomplete="current-password">
    <button class="btn-admin primary" id="loginBtn">Přihlásit se</button>
  </div>
</div>

<div class="admin-shell" id="adminShell" style="display:none;">
  <nav class="admin-sidebar" id="adminSidebar">
    <div class="admin-brand">
      <div class="admin-brand-mark"><img src="/assets/img/brand/logo-pz-mark.png" alt="" width="36" height="36"></div>
      <div class="admin-brand-text">
        <strong>Platnéřství</strong>
        <span>Administrace</span>
      </div>
      <button type="button" class="admin-sidebar-close" id="sidebarClose" aria-label="Zavřít menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="admin-nav" id="adminNav"><!-- vykreslí admin.js --></div>
    <div class="admin-sidebar-foot">
      <a href="/" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
        Zpět na web
      </a>
      <button type="button" id="logoutBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        Odhlásit se
      </button>
    </div>
  </nav>

  <div class="admin-main">
    <div class="admin-topbar">
      <button type="button" class="admin-menu-toggle" id="sidebarToggle" aria-label="Otevřít menu sekcí" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <span class="admin-status" id="adminStatus">Načítám…</span>
      <div class="admin-topbar-actions">
        <button class="btn-admin" id="discardBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
          Zahodit změny
        </button>
        <button class="btn-admin primary" id="publishBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>
          Publikovat
        </button>
      </div>
    </div>
    <div class="admin-content" id="adminContent"><!-- vykreslí admin.js --></div>
  </div>
  <div class="admin-sidebar-backdrop" id="sidebarBackdrop"></div>
</div>

<script src="js/admin.js" defer></script>
</body>
</html>
