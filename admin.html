<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administrace — Platnéřství Pavel Zátrapa</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">

<div class="admin-login" id="adminLogin">
  <div class="admin-login-card">
    <div class="admin-login-brand">Platnéřství Zátrapa</div>
    <h1>Přihlášení</h1>
    <p class="sub">Zadej heslo pro přístup do administrace.</p>
    <div class="err" id="loginErr"></div>
    <input type="password" id="loginPassword" placeholder="Heslo" autocomplete="current-password">
    <button class="btn-admin primary" id="loginBtn">Přihlásit se</button>
  </div>
</div>

<div class="admin-shell" id="adminShell" style="display:none;">
  <nav class="admin-sidebar">
    <div class="admin-brand">
      <div class="admin-brand-mark">PZ</div>
      <div class="admin-brand-text">
        <strong>Platnéřství</strong>
        <span>Administrace</span>
      </div>
    </div>
    <div class="admin-nav" id="adminNav"><!-- vykreslí admin.js --></div>
    <div class="admin-sidebar-foot">
      <a href="/" target="_blank" rel="noopener">← Zpět na web</a>
      <button type="button" id="logoutBtn">Odhlásit se</button>
    </div>
  </nav>

  <div class="admin-main">
    <div class="admin-topbar">
      <span class="admin-status" id="adminStatus">Načítám…</span>
      <div class="admin-topbar-actions">
        <button class="btn-admin" id="discardBtn">Zahodit změny</button>
        <button class="btn-admin primary" id="publishBtn">Publikovat</button>
      </div>
    </div>
    <div class="admin-content" id="adminContent"><!-- vykreslí admin.js --></div>
  </div>
</div>

<script src="js/admin.js" defer></script>
</body>
</html>
